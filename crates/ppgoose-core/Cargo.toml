[package]
name = "ppgoose-core"
version = "0.2.0"
description = "Local image compression engine shared by PPGoose and CMS integrations"
edition = "2021"
rust-version = "1.89"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
sha2 = "0.10"
oxipng = { version = "9", default-features = false, features = ["parallel"] }
imagequant = "4"
png = "0.17"
rgb = "0.8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "rayon"] }
gif = "0.14"
gifski = { version = "1", default-features = false }
imgref = "1"
dssim-core = "3"
mozjpeg = { version = "0.10", default-features = false }
webp = { version = "0.3", default-features = false }
ravif = { version = "0.11", default-features = false, features = ["threading"] }
