[package]
name = "ppgoose"
version = "0.2.0"
description = "PPGoose — Smart Image Compressor"
authors = []
edition = "2021"
rust-version = "1.90"

[lib]
name = "ppgoose_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
rayon = "1"
walkdir = "2"
ppgoose-core = { path = "../crates/ppgoose-core" }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[profile.dev]
incremental = true

# NOTE: do not set panic = "abort" here — mozjpeg reports errors via panics
# and jpeg.rs relies on catch_unwind to turn them into per-file errors.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
